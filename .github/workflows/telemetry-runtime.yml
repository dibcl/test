name: Telemetry Runtime Tests

on:
  pull_request:
    paths:
      - "lab/mock-telemetry/**"
      - ".github/workflows/telemetry-runtime.yml"
  push:
    branches:
      - main
      - "refactor/**"
    paths:
      - "lab/mock-telemetry/**"
      - ".github/workflows/telemetry-runtime.yml"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: lab/mock-telemetry

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: lab/mock-telemetry/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile runtime
        run: python -m compileall telemetry run_agent.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
